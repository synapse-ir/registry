[project]
name = "synapse-registry"
version = "0.1.0"
description = "SYNAPSE Model Registry — FastAPI server for adapter discovery and capability routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "aiosqlite",
    "pydantic>=2.0",
    "alembic",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
